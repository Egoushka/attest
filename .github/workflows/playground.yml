name: Playground

# The playground and its public API (playground/SPEC.md). Kept out of ci.yml: that one builds the
# library on .NET 8 and 9, this one needs the .NET 10 SDK and the Native AOT toolchain.
on:
  push:
    branches: [main]
    paths: ["playground/**", "Attest/**", "Directory.Build.props", ".github/workflows/playground.yml"]
  pull_request:
    paths: ["playground/**", "Attest/**", "Directory.Build.props", ".github/workflows/playground.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  # A main run is never cancelled: a newer push must not leave the image of an older commit unpublished.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  IMAGE: ghcr.io/egoushka/attest-playground

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test playground/Attest.Playground.Tests/Attest.Playground.Tests.csproj -c Release
      # A12: Native AOT with no trim or AOT warning.
      - run: dotnet publish playground/Attest.Playground/Attest.Playground.csproj -c Release -r linux-x64 -warnaserror -o out
      - name: Acceptance checks against the AOT binary
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:8080 out/Attest.Playground &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          python3 -I playground/acceptance.py http://127.0.0.1:8080

  # Build the image once (amd64: nickel is x86-64), smoke that image, hand the same image to publish.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: playground/Dockerfile
          platforms: linux/amd64
          load: true
          tags: attest-playground:ci
      - name: Smoke the image
        run: |
          docker run -d --name pg -p 8080:8080 attest-playground:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS "http://127.0.0.1:8080/v1/validate?value=BE0403019261&country=BE" | grep -q '"valid":true'
          docker exec pg /app/Attest.Playground --healthcheck
          docker rm -f pg
      - name: Save the smoked image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save attest-playground:ci -o "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # The only job with packages: write. It pushes the image the smoke test ran, never a rebuild.
  publish:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the smoked image
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          for t in "sha-$GITHUB_SHA" latest; do
            docker tag attest-playground:ci "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
