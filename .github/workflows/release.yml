name: Release

# Publishes to NuGet when a version tag is pushed. Needs a NUGET_API_KEY secret
# on the repository; without it the job fails at the push step and nothing ships.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build
        run: dotnet build Attest.sln --configuration Release

      - name: Test
        run: dotnet test Attest.Tests/Attest.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack Attest.sln --configuration Release --no-build --output ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
