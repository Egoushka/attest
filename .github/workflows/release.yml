name: Release

# Publishes to NuGet when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The tag is the single source of truth for the version — nothing in the repository
# records it, so the two packages cannot drift apart or disagree with the tag.
# Requires a NUGET_API_KEY repository secret; see RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not a SemVer version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a changelog entry
        run: |
          # A release nobody documented is a release nobody can audit later.
          if ! grep -q "^## ${{ steps.version.outputs.version }}\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section." >&2
            exit 1
          fi

      - name: Build
        run: dotnet build Attest.sln --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Attest.Tests/Attest.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack Attest.sln --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./artifacts

      - name: Push to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create the GitHub release
        run: |
          # The changelog section for this version becomes the release notes.
          awk -v v="## ${{ steps.version.outputs.version }}" '
            $0 ~ "^" v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            ${{ contains(steps.version.outputs.version, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
