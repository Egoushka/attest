name: Release

# Publishes to NuGet when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The tag is the single source of truth for the version — nothing in the repository
# records it, so the two packages cannot drift apart or disagree with the tag.
# Publishing uses nuget.org trusted publishing: the job asks GitHub for a short-lived
# OIDC token, nuget.org validates it against a policy naming this repository and THIS
# WORKFLOW FILE, and hands back an API key valid for one hour. There is no long-lived
# secret to leak or rotate. Renaming this file breaks publishing until the policy is
# updated to match. See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # request the OIDC token trusted publishing exchanges for an API key

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Require the tag to be on main
        run: |
          # A v* tag pushed from a branch would publish code that never reached main and never passed
          # its required check. main is fetched explicitly rather than assumed: a tag push checks out
          # the tag, and relying on actions/checkout to have created refs/remotes/origin/main would
          # make every release depend on that action's refspec.
          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME is not an ancestor of main; refusing to publish it." >&2
            exit 1
          fi

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not a SemVer version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease documents the same changes as the release it leads to, so the
          # changelog is looked up under the base version: v1.0.0-rc.1 reads ## 1.0.0.
          echo "changelog=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Require a changelog entry, and build the release notes from it
        run: |
          # A release nobody documented is a release nobody can audit later. The notes are extracted
          # here rather than after the push, because everything before the push is still reversible.
          if ! grep -q "^## ${{ steps.version.outputs.changelog }}\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.changelog }}' section." >&2
            exit 1
          fi
          # The heading match is anchored on a space or end of line so that "## 1.0.1" does not also
          # match "## 1.0.10", and the exit rule stops at the next section.
          awk -v v="## ${{ steps.version.outputs.changelog }}" '
            $0 ~ "^" v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "The '## ${{ steps.version.outputs.changelog }}' section is empty." >&2
            exit 1
          fi

      - name: Build
        run: dotnet build Attest.sln --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Attest.Tests/Attest.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack Attest.sln --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./artifacts

      # Immediately before the push: the key nuget.org returns lives for one hour, and
      # each OIDC token buys exactly one key.
      - name: Exchange the OIDC token for a NuGet API key
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Through the environment rather than interpolated into the command, so the key is never
          # part of a shell line that could be echoed or logged.
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Create the GitHub release
        run: |
          # notes.md was written and checked before the push.
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            ${{ contains(steps.version.outputs.version, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
