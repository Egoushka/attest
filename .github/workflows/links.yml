name: Source links

# Design 5: a dead source link means "re-verify the rule", never "delete it". This checks every
# https URL cited in the code and opens or updates ONE issue listing the dead ones. It does not
# gate anything. A 401/403/429 is a site refusing a bot, not a dead page, so it is listed apart.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every cited URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -rhoE 'https://[^" <>)]+' Attest --include='*.cs' | sed -E 's/[.,;]+$//' | sort -u > urls.txt
          : > dead.txt
          : > blocked.txt
          while read -r url; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 -A 'Mozilla/5.0 (attest link check)' "$url" || echo 000)
            case "$code" in
              2??|3??) ;;
              401|403|429) echo "$code $url" >> blocked.txt ;;
              *) echo "$code $url" >> dead.txt ;;
            esac
          done < urls.txt
          echo "checked $(wc -l < urls.txt), dead $(wc -l < dead.txt), blocked $(wc -l < blocked.txt)"
          title="Source links: dead or moved"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -s dead.txt ]; then
            {
              echo "These cited sources did not answer. Re-verify the rule that cites each one; do not delete the rule."
              echo
              echo '```'
              cat dead.txt
              echo '```'
              if [ -s blocked.txt ]; then
                echo
                echo "Refused the checker (401/403/429), so not known dead:"
                echo '```'
                cat blocked.txt
                echo '```'
              fi
            } > body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$title" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every cited source answered on this run."
          fi
